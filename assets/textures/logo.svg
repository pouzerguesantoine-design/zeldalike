  <!-- Bouclier -->
  <path d="M128 40 L200 64 L196 132 C192 176 164 204 128 222 C92 204 64 176 60 132 L56 64 Z"
        fill="#3f9b3a" stroke="#e8b84a" stroke-width="10" stroke-linejoin="round"/>
  <path d="M128 58 L184 76 L181 130 C178 166 156 188 128 203 Z" fill="#2f7d2c"/>
  <!-- Épée en travers -->
  <g transform="rotate(-40 128 128)">
    <path d="M120 22 L136 22 L136 158 L128 172 L120 158 Z" fill="#e9eef5" stroke="#1c2340" stroke-width="5" stroke-linejoin="round"/>
