    <rect x="120" y="176" width="16" height="40" rx="4" fill="#7a4a24" stroke="#1c2340" stroke-width="5"/>
    <circle cx="128" cy="224" r="11" fill="#e8b84a" stroke="#1c2340" stroke-width="5"/>
  </g>
</svg>
